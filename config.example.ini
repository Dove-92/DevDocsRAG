# Copy this file to config.ini and replace every change-me value.
# Environment variables override these values:
# MYSQL_HOST, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DATABASE,
# MILVUS_HOST, MILVUS_PORT, MILVUS_DATABASE_NAME, MILVUS_COLLECTION_NAME,
# DASHSCOPE_API_KEY, REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_DB.

[mysql]
host = localhost
user = root
password = change-me
database = subjects_kg

[redis]
host = localhost
port = 6379
password = change-me
db = 0

[logger]
log_file = logs/app.log

[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = devdocs_final

[llm]
model = qwen-plus
dashscope_api_key = change-me
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 2
relevance_threshold = 0.2
support_judge = true
support_judge_max_chars = 4000

[app]
valid_sources = ["langchain", "milvus", "bge", "transformers"]
customer_service_phone = 12345678
